name: Main CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-quality:
    name: Frontend Quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Build
        run: npm run build

  backend-quality:
    name: Backend Quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build isolated code runner
        run: docker build -t codepulse-sandbox:1 deploy/sandbox

      - name: Test Node.js backend
        run: npm run backend:test

      - name: Test deployment configuration
        run: npm run deploy:test

  deploy-local:
    name: Deploy main on Windows (WSL2)
    if: github.ref == 'refs/heads/main'
    needs:
      - frontend-quality
      - backend-quality
    runs-on: [self-hosted, windows, x64, local-deploy]
    timeout-minutes: 30
    outputs:
      public_url: ${{ steps.cloudflare.outputs.public_url }}
    concurrency:
      group: spm-git-platform-deploy
      cancel-in-progress: false
    env:
      SPM_DEPLOY_ENVIRONMENT: main
      SPM_WSL_DISTRO: ${{ vars.SPM_WSL_DISTRO }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check WSL2 deployment runtime
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase host-check

      - name: Validate main secrets and runner permissions
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_MAIN_OWNER }}
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase check

      - name: Build production frontend
        env:
          VITE_BACKEND_URL: /api
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build isolated code runner on deployment host
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase build-sandbox

      - name: Configure main services and shared Gitea
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITEA_API_TOKEN: ${{ secrets.GITEA_MAIN_API_TOKEN }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_MAIN_OWNER }}
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase setup

      - name: Deploy atomic release
        shell: powershell
        env:
          SPM_WSL_RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: ./deploy/actions/invoke-wsl.ps1 -Phase deploy

      - name: Verify local deployment
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase verify-local

      - name: Start one Cloudflare Quick Tunnel
        id: cloudflare
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase tunnel

      - name: Configure shared Gitea canonical URL
        id: gitea
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITEA_API_TOKEN: ${{ secrets.GITEA_MAIN_API_TOKEN }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_MAIN_OWNER }}
          SPM_DEPLOY_PUBLIC_URL: ${{ steps.cloudflare.outputs.public_url }}
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase public

      - name: Verify public main and shared Gitea
        env:
          SPM_DEPLOY_PUBLIC_URL: ${{ steps.cloudflare.outputs.public_url }}
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase verify-public

      - name: Publish main and shared Gitea URLs
        shell: powershell
        env:
          MAIN_URL: ${{ steps.cloudflare.outputs.public_url }}
          GITEA_URL: ${{ steps.gitea.outputs.gitea_url }}
        run: |
          @"
          ### Public deployment URL

          - Frontend: [$env:MAIN_URL/]($env:MAIN_URL/)
          - Backend health: [$env:MAIN_URL/api/health]($env:MAIN_URL/api/health)
          - Shared Gitea: [$env:GITEA_URL]($env:GITEA_URL)
          - Repository owner for main: configured GITEA_MAIN_OWNER, or codepulse-bot-main.
          - Gitea uses the same PostgreSQL database and volumes as staging.

          > The public URL is HTTPS. Do not append the WSL origin port (for example `:8080`).
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
