name: Main CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Build
        run: npm run build

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Node.js backend
        run: npm run backend:test

  deploy-local:
    name: Deploy local Debian
    needs:
      - frontend-quality
      - backend-quality
    runs-on: [self-hosted, linux, x64, local-deploy]
    timeout-minutes: 20
    concurrency:
      group: local-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend
        env:
          VITE_BACKEND_URL: ${{ vars.SPM_BACKEND_URL }}
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Deploy atomic release
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          sudo /usr/local/sbin/spm-deploy "$GITHUB_WORKSPACE" "$release_id"

      - name: Verify local deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1/api/health
          curl --fail --silent --show-error http://127.0.0.1/ >/dev/null
