name: Staging Deploy

on:
  workflow_call:
    inputs:
      app_ref:
        description: Git ref or commit to deploy
        required: false
        type: string
      runner_ready:
        description: The caller verified an online idle local-deploy runner
        required: true
        type: boolean
    secrets:
      GITEA_ADMIN_PASSWORD:
        required: true
      RUNNER_SUDO_PASSWORD:
        required: false
      POSTGRES_PASSWORD:
        required: false
      GITEA_API_TOKEN:
        required: false
    outputs:
      public_url:
        description: Public URL of the deployed staging application
        value: ${{ jobs.deploy-staging.outputs.public_url }}

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging on Windows (WSL2)
    if: inputs.runner_ready && (inputs.app_ref != '' || github.ref == 'refs/heads/staging')
    runs-on: [self-hosted, windows, x64, local-deploy]
    timeout-minutes: 30
    concurrency:
      group: spm-git-platform-deploy
      cancel-in-progress: false
    env:
      SPM_DEPLOY_ENVIRONMENT: staging
      SPM_WSL_DISTRO: ${{ vars.SPM_WSL_DISTRO }}
    outputs:
      public_url: ${{ steps.cloudflare.outputs.public_url }}
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check WSL2 deployment runtime
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase host-check

      - name: Validate staging secrets and runner permissions
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase check

      - name: Build staging frontend
        env:
          VITE_BACKEND_URL: /api
          VITE_OBSERVABILITY_ENV: staging
          VITE_OBSERVABILITY_RELEASE: ${{ github.sha }}
          VITE_DATADOG_APPLICATION_ID: ${{ vars.DATADOG_APPLICATION_ID }}
          VITE_DATADOG_CLIENT_TOKEN: ${{ vars.DATADOG_CLIENT_TOKEN }}
          VITE_DATADOG_SITE: ${{ vars.DATADOG_SITE }}
          VITE_DATADOG_SESSION_SAMPLE_RATE: ${{ vars.DATADOG_SESSION_SAMPLE_RATE }}
          VITE_DATADOG_SESSION_REPLAY_SAMPLE_RATE: ${{ vars.DATADOG_SESSION_REPLAY_SAMPLE_RATE }}
          VITE_DATADOG_DASHBOARD_URL: ${{ vars.DATADOG_DASHBOARD_URL }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_DASHBOARD_URL: ${{ vars.SENTRY_DASHBOARD_URL }}
          VITE_GRAFANA_FARO_URL: ${{ vars.GRAFANA_FARO_URL }}
          VITE_GRAFANA_APP_NAME: ${{ vars.GRAFANA_APP_NAME }}
          VITE_GRAFANA_SESSION_SAMPLING_RATE: ${{ vars.GRAFANA_SESSION_SAMPLING_RATE }}
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run check-types
          npm run build

      - name: Test staging backend
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase tests

      - name: Test staging deployment configuration
        run: npm run deploy:test

      - name: Configure staging services and Gitea
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITEA_API_TOKEN: ${{ secrets.GITEA_API_TOKEN }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase setup

      - name: Deploy staging release
        shell: powershell
        env:
          SPM_WSL_RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: ./deploy/actions/invoke-wsl.ps1 -Phase deploy

      - name: Verify staging locally
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase verify-local

      - name: Start staging Cloudflare Quick Tunnel
        id: cloudflare
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase tunnel

      - name: Configure Gitea public URL
        id: gitea
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITEA_API_TOKEN: ${{ secrets.GITEA_API_TOKEN }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
          SPM_DEPLOY_PUBLIC_URL: ${{ steps.cloudflare.outputs.public_url }}
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase public

      - name: Verify public staging and Gitea
        env:
          SPM_DEPLOY_PUBLIC_URL: ${{ steps.cloudflare.outputs.public_url }}
        shell: powershell
        run: ./deploy/actions/invoke-wsl.ps1 -Phase verify-public

      - name: Publish staging URL to job summary
        if: ${{ success() && steps.cloudflare.outputs.public_url != '' }}
        shell: powershell
        env:
          STAGING_URL: ${{ steps.cloudflare.outputs.public_url }}
          GITEA_URL: ${{ steps.gitea.outputs.gitea_url }}
        run: |
          @"
          ## Staging deployment ready

          ### Open staging: [$env:STAGING_URL/]($env:STAGING_URL/)

          **Staging URL (copy):**

          ```text
          $env:STAGING_URL
          ```

          - Backend health: [$env:STAGING_URL/api/health]($env:STAGING_URL/api/health)
          - Local Grafana with Loki: [$env:STAGING_URL/observation/grafana/]($env:STAGING_URL/observation/grafana/)
          - Datadog/Sentry: configure DATADOG_DASHBOARD_URL and SENTRY_DASHBOARD_URL to your account URLs.
          - Shared Gitea: [$env:GITEA_URL]($env:GITEA_URL)
          - Gitea admin username: configured GITEA_ADMIN_USERNAME, or spm-admin.
          - Backend Gitea token: verified by private repository/branch/file writes and saved in WSL.
          - Link type: Cloudflare Quick Tunnel; it may change when the tunnel restarts.
          - The public URL is HTTPS; do not append the WSL origin port (for example `:8080`).
          - Backend service: spm-staging-backend.service
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
