name: Staging Deploy

on:
  push:
    branches:
      - staging
  workflow_call:
    inputs:
      app_ref:
        description: Git ref or commit to deploy
        required: false
        type: string
    secrets:
      GITEA_ADMIN_PASSWORD:
        required: true
      RUNNER_SUDO_PASSWORD:
        required: false
      POSTGRES_PASSWORD:
        required: false
      GITEA_API_TOKEN:
        required: false
    outputs:
      public_url:
        description: Public URL of the deployed staging application
        value: ${{ jobs.deploy-staging.outputs.public_url }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging to Debian
    if: inputs.app_ref != '' || github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, linux, x64, local-deploy]
    timeout-minutes: 30
    outputs:
      public_url: ${{ steps.cloudflare.outputs.public_url }}
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate staging secrets and runner permissions
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
        run: node deploy/actions/run-staging-setup.mjs check

      - name: Build staging frontend
        env:
          VITE_BACKEND_URL: /api
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run check-types
          npm run build

      - name: Test staging backend
        run: npm run backend:test

      - name: Test staging deployment configuration
        run: npm run deploy:test

      - name: Configure staging services and Gitea
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITEA_API_TOKEN: ${{ secrets.GITEA_API_TOKEN }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
        run: node deploy/actions/run-staging-setup.mjs setup

      - name: Deploy staging release
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"

          if [[ ! -x /usr/local/sbin/spm-staging-deploy ]]; then
            echo '::error::/usr/local/sbin/spm-staging-deploy is missing or not executable on the local runner.'
            echo '::error::The Configure staging services and Gitea step must complete successfully before deployment.'
            exit 1
          fi

          timeout --signal=TERM --kill-after=30s 25m \
            sudo -n /usr/local/sbin/spm-staging-deploy "$GITHUB_WORKSPACE" "$release_id"

      - name: Verify staging locally
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            http://127.0.0.1:8080/ >/dev/null

      - name: Start staging Cloudflare Quick Tunnel
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail

          cloudflared_path="$(command -v cloudflared || true)"
          if [[ -z "$cloudflared_path" ]]; then
            echo '::error::cloudflared is not installed on the local-deploy runner.'
            exit 1
          fi

          started_at="$(date -u --iso-8601=seconds)"
          if ! sudo -n systemctl restart spm-staging-quick-tunnel.service; then
            echo '::error::The persistent spm-staging-quick-tunnel.service is not installed or cannot be restarted.'
            echo '::error::Check Configure staging services and Gitea for service installation errors.'
            exit 1
          fi

          public_url=""
          for _ in $(seq 1 30); do
            public_url="$(sudo -n journalctl -u spm-staging-quick-tunnel.service --since "$started_at" --no-pager -n 100 2>/dev/null \
              | grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' \
              | grep -vE '^https://api\.trycloudflare\.com$' \
              | tail -n 1 || true)"
            if [[ -n "$public_url" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$public_url" ]]; then
            echo '::error::Staging Cloudflare Quick Tunnel did not return a public URL.'
            sudo -n journalctl -u spm-staging-quick-tunnel.service --no-pager -n 100 || true
            exit 1
          fi

          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Staging URL::$public_url"

      - name: Configure Gitea public URL
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
          GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITEA_API_TOKEN: ${{ secrets.GITEA_API_TOKEN }}
          GITEA_ADMIN_USERNAME: ${{ vars.GITEA_ADMIN_USERNAME }}
          GITEA_ADMIN_EMAIL: ${{ vars.GITEA_ADMIN_EMAIL }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
          SPM_STAGING_PUBLIC_URL: ${{ steps.cloudflare.outputs.public_url }}
        run: node deploy/actions/run-staging-setup.mjs public

      - name: Verify public staging and Gitea
        env:
          STAGING_PUBLIC_URL: ${{ steps.cloudflare.outputs.public_url }}
        run: |
          set -euo pipefail
          public_url="$STAGING_PUBLIC_URL"
          reachable=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --retry 1 --retry-all-errors \
              --location --connect-timeout 5 --max-time 15 "$public_url/" >/dev/null 2>&1 && \
               curl --fail --silent --show-error --retry 1 --retry-all-errors \
              --location --connect-timeout 5 --max-time 15 "$public_url/api/health" >/dev/null 2>&1 && \
               curl --fail --silent --show-error --retry 1 --retry-all-errors \
              --location --connect-timeout 5 --max-time 15 "$public_url/git/" >/dev/null 2>&1 && \
               curl --fail --silent --show-error --retry 1 --retry-all-errors \
              --location --connect-timeout 5 --max-time 15 "$public_url/git/api/v1/version" >/dev/null 2>&1; then
              reachable=1
              break
            fi
            sleep 2
          done

          if [[ "$reachable" != '1' ]]; then
            echo "::error::Staging Cloudflare Quick Tunnel URL was returned but did not become reachable: $public_url"
            curl --fail --show-error --max-time 15 "$public_url/" || true
            curl --fail --show-error --max-time 15 "$public_url/api/health" || true
            curl --fail --show-error --max-time 15 "$public_url/git/" || true
            curl --fail --show-error --max-time 15 "$public_url/git/api/v1/version" || true
            exit 1
          fi

      - name: Publish staging URL to job summary
        if: ${{ success() && steps.cloudflare.outputs.public_url != '' }}
        shell: bash
        env:
          STAGING_URL: ${{ steps.cloudflare.outputs.public_url }}
        run: |
          set -euo pipefail

          {
            echo '## Staging deployment ready'
            echo
            echo "### Open staging: [$STAGING_URL/]($STAGING_URL/)"
            echo
            echo '**Staging URL (copy):**'
            echo
            echo '```text'
            echo "$STAGING_URL"
            echo '```'
            echo
            echo "- Backend health: [$STAGING_URL/api/health]($STAGING_URL/api/health)"
            echo "- Gitea: [$STAGING_URL/git/]($STAGING_URL/git/)"
            echo '- Gitea admin username: configured GITEA_ADMIN_USERNAME, or spm-admin.'
            echo '- Backend Gitea token: verified by private repository/branch/file writes and saved on the runner.'
            echo '- Link type: Cloudflare Quick Tunnel; it may change when the tunnel restarts.'
            echo '- The public URL is HTTPS; do not append the runner origin port (for example `:8080`).'
            echo "- Backend service: spm-staging-backend.service"
          } >> "$GITHUB_STEP_SUMMARY"
