name: Staging E2E Gate

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-source:
    name: Promotion source (staging only)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Enforce staging promotion path
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" != "staging" || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "Only the repository's staging branch may be promoted into main."
            echo "Received: ${HEAD_REPOSITORY}:${HEAD_REF}"
            exit 1
          fi

  e2e-remote:
    name: E2E (test-E2E runner)
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'staging' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_REPOSITORY: SPM-Specialized-Project/test-E2E
      E2E_DISPATCH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
    steps:
      - name: Prepare dispatch payload
        id: payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          if [[ -z "${E2E_DISPATCH_TOKEN:-}" ]]; then
            echo '::error::Configure the E2E_DISPATCH_TOKEN secret in SPM-frontend.'
            exit 1
          fi

          app_sha="$PUSH_SHA"
          if [[ "$EVENT_NAME" == 'pull_request' && -n "$PR_HEAD_SHA" && "$PR_HEAD_SHA" != 'null' ]]; then
            app_sha="$PR_HEAD_SHA"
          fi

          correlation_id="${GITHUB_REPOSITORY//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg app_sha "$app_sha" \
            --arg correlation_id "$correlation_id" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg pr_number "$PR_NUMBER" \
            '{event_type: "spm-staging-e2e", client_payload: {
              app_sha: $app_sha,
              correlation_id: $correlation_id,
              app_repository: $repository,
              source_workflow_run_id: $workflow_run_id,
              pull_request_number: $pr_number
            }}' > dispatch.json

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/$E2E_REPOSITORY/dispatches" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $E2E_DISPATCH_TOKEN" \
            --header 'Content-Type: application/json' \
            --data @dispatch.json

          echo "app_sha=$app_sha" >> "$GITHUB_OUTPUT"
          echo "correlation_id=$correlation_id" >> "$GITHUB_OUTPUT"

      - name: Find dispatched test-E2E run
        id: remote-run
        shell: bash
        env:
          CORRELATION_ID: ${{ steps.payload.outputs.correlation_id }}
        run: |
          set -euo pipefail

          expected_name="SPM E2E $CORRELATION_ID"
          for _ in $(seq 1 60); do
            response="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $E2E_DISPATCH_TOKEN" \
              "https://api.github.com/repos/$E2E_REPOSITORY/actions/runs?event=repository_dispatch&per_page=30")"

            run_id="$(printf '%s' "$response" | jq -r --arg expected "$expected_name" '
              [.workflow_runs[] | select(.event == "repository_dispatch" and .name == $expected)]
              | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done

          echo "::error::The test-E2E workflow did not start."
          exit 1

      - name: Wait for test-E2E local runner
        shell: bash
        env:
          REMOTE_RUN_ID: ${{ steps.remote-run.outputs.run_id }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 180); do
            response="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $E2E_DISPATCH_TOKEN" \
              "https://api.github.com/repos/$E2E_REPOSITORY/actions/runs/$REMOTE_RUN_ID")"
            status="$(printf '%s' "$response" | jq -r '.status')"
            conclusion="$(printf '%s' "$response" | jq -r '.conclusion // empty')"
            html_url="$(printf '%s' "$response" | jq -r '.html_url')"

            if [[ "$status" == 'completed' ]]; then
              if [[ "$conclusion" == 'success' ]]; then
                echo "Remote E2E passed: $html_url"
                exit 0
              fi
              echo "::error title=Remote E2E failed::$html_url"
              exit 1
            fi
            sleep 10
          done

          echo '::error::Timed out waiting for the test-E2E local runner.'
          exit 1
