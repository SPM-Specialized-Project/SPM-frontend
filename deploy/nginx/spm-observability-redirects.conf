# Safe defaults used before the first frontend deployment. The build-generated
# file replaces these targets with configured dashboard URLs on each release.
map $uri $spm_observability_redirect {
    default "";
    ~^/(observation|obsesrvation)/datadog/?$ "https://docs.datadoghq.com/real_user_monitoring/application_monitoring/browser/setup/client/";
    ~^/(observation|obsesrvation)/grafana/?$ "https://grafana.com/docs/grafana-cloud/observe-and-act/monitor-applications/frontend-observability/get-started/instrument-react/";
    ~^/(observation|obsesrvation)/sentry/?$ "https://docs.sentry.io/platforms/javascript/guides/react/";
}
