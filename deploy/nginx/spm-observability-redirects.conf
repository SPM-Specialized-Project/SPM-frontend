# Safe defaults used before the first frontend deployment. The build-generated
# file replaces these targets with configured dashboard URLs on each release.
map $uri $spm_observability_redirect {
    default "";
    ~^/(observation|obsesrvation)/datadog/?$ "https://app.datadoghq.com/rum/explorer";
    ~^/(observation|obsesrvation)/grafana/?$ "https://grafana.com/orgs/";
    ~^/(observation|obsesrvation)/sentry/?$ "https://sentry.io/organizations/";
}
