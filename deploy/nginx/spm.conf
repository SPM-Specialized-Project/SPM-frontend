server {
    listen 80;
    server_name _;

    root /opt/spm-frontend/current/frontend;
    index index.html;
    client_max_body_size 20m;

    location = /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /git {
        # Keep the public scheme/host instead of exposing the HTTP tunnel origin.
        absolute_redirect off;
        return 308 /git/;
    }

    location ~ ^/(git|v2)($|/) {
        client_max_body_size 512M;

        # Preserve encoded paths and remove /git before forwarding to Gitea.
        rewrite ^ $request_uri;
        rewrite ^/(git($|/))?(.*) /$3 break;

        proxy_pass http://127.0.0.1:8211$uri;
        proxy_http_version 1.1;
        proxy_set_header Connection $http_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|pdf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
