services:
  loki:
    image: grafana/loki:3.6.7
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      - loki
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8081/observation/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the private env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.21.0
    profiles:
      - host-logs
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped
    networks:
      - observability

  gateway:
    image: nginx:1.29-alpine
    profiles:
      - local
    depends_on:
      - grafana
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./local-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist/observability-redirects.conf:/etc/nginx/conf.d/spm-observability-redirects.conf:ro
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:

volumes:
  grafana-data:
    name: ${OBSERVABILITY_VOLUME_PREFIX:-spm-observability}-grafana
  loki-data:
    name: ${OBSERVABILITY_VOLUME_PREFIX:-spm-observability}-loki
  alloy-data:
    name: ${OBSERVABILITY_VOLUME_PREFIX:-spm-observability}-alloy
