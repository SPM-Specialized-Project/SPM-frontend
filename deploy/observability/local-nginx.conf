server {
    listen 8081;
    server_name _;

    location = /observation/grafana {
        return 308 /observation/grafana/;
    }

    location = /obsesrvation/grafana {
        return 308 /observation/grafana/;
    }

    location ^~ /observation/grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /observation/grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spm_connection_upgrade;
        proxy_read_timeout 300s;
    }

    location ^~ /obsesrvation/grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /observation/grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spm_connection_upgrade;
    }

    location ~ ^/(observation|obsesrvation)/datadog/?$ {
        if ($spm_observability_datadog_url = "") {
            return 503 "Set DATADOG_DASHBOARD_URL to your account dashboard URL.";
        }
        return 302 $spm_observability_datadog_url;
    }

    location ~ ^/(observation|obsesrvation)/sentry/?$ {
        if ($spm_observability_sentry_url = "") {
            return 503 "Set SENTRY_DASHBOARD_URL to your account project URL.";
        }
        return 302 $spm_observability_sentry_url;
    }

    location / {
        return 404 "Not found.";
    }
}
