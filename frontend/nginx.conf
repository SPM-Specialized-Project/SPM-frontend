server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files, fallback to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /observation/grafana {
        return 308 /observation/grafana/;
    }

    location = /obsesrvation/grafana {
        return 308 /observation/grafana/;
    }

    location ^~ /observation/grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /observation/grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spm_connection_upgrade;
    }

    location ^~ /obsesrvation/grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /observation/grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spm_connection_upgrade;
    }

    location ~ ^/(observation|obsesrvation)/datadog/?$ {
        if ($spm_observability_datadog_url = "") {
            return 503 "Configure DATADOG_DASHBOARD_URL with your account dashboard URL.";
        }
        return 302 $spm_observability_datadog_url;
    }

    location ~ ^/(observation|obsesrvation)/sentry/?$ {
        if ($spm_observability_sentry_url = "") {
            return 503 "Configure SENTRY_DASHBOARD_URL with your account project URL.";
        }
        return 302 $spm_observability_sentry_url;
    }

    # Optional: caching for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
